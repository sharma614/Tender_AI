name: TenderAI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ --junitxml=junit/test-results.xml -q

      - name: Generate Evaluation Corpus
        run: |
          # corpus/pdfs/ is gitignored — must be rebuilt from the deterministic
          # generator before the smoke test can verify gold-span presence.
          python corpus/generate_synthetic.py --seed 42 --count 18 --clean

      - name: Run Corpus Smoke Test (no DB or API key required)
        run: |
          python eval_harness.py --mode smoke --no-save
