name: TenderAI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ --junitxml=junit/test-results.xml -q

      - name: Run Corpus Smoke Test (if available)
        run: |
          if [ -f "corpus/generate_synthetic.py" ]; then
            python corpus/generate_synthetic.py --seed 42 --count 18 --clean
            python eval_harness.py --mode smoke --no-save
          else
            echo "Synthetic corpus generator excluded from repository. Skipping corpus smoke test."
          fi
