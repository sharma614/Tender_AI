# render.yaml — Render Blueprint for TenderAI (free-tier API)
# Docs: https://render.com/docs/blueprint-spec
#
# Free Web Service only. A Celery Background Worker is a paid Render service;
# the API runs jobs in a background thread unless USE_CELERY=true.

services:
  - type: web
    name: tenderai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: tenderai-secrets
      - key: PORT
        value: "8000"
      - key: USE_CELERY
        value: "false"
      - key: INDEX_TENDER_EMBEDDINGS
        value: "false"

envVarGroups:
  - name: tenderai-secrets
    envVars:
      - key: DATABASE_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: "tenders"

      - key: EMBEDDING_MODEL_NAME
        value: "all-MiniLM-L6-v2"
